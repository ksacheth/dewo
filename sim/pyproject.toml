[project]
name = "sim"
version = "0.2.0"
description = "Deterministic MuJoCo rover simulator and Replay (M1)"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.17.0",
]

[project.scripts]
sim = "sim.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
